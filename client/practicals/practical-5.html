<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practical 5 | Fixora Bootstrap Registration</title>

  <!-- PRACTICAL 5 PART I: ONLINE BOOTSTRAP CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- PRACTICAL 5 PART II: OFFLINE BOOTSTRAP
       Download Bootstrap 5's bootstrap.min.css and bootstrap.bundle.min.js.
       Save them as:
       client/vendor/bootstrap/css/bootstrap.min.css
       client/vendor/bootstrap/js/bootstrap.bundle.min.js
       To demonstrate offline mode, comment out the CDN CSS line above and uncomment this line:
  -->
  <!-- <link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"> -->

  <style>
    body{background:#f3f6fb}.brand{font-weight:800;letter-spacing:.08em;color:#1d4ed8}
    .form-shell{max-width:780px;margin:36px auto}.required-note{font-size:.9rem;color:#64748b}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">FIXORA</a>
      <span class="navbar-text">Practical 5 · Bootstrap 5</span>
    </div>
  </nav>

  <main class="container form-shell">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <span class="badge text-bg-primary mb-3">PART III · REGISTRATION FORM</span>
        <h1 class="h3 fw-bold">Student Registration</h1>
        <p class="text-secondary">Bootstrap 5 form demonstration for the Full Stack Development practical.</p>
        <p class="required-note">Fields marked * are required.</p>

        <form id="registrationForm" class="row g-3">
          <div class="col-12 col-md-6">
            <label for="title" class="form-label">Title *</label>
            <select class="form-select" id="title" required>
              <option value="">Choose title</option>
              <option>Mr.</option><option>Ms.</option><option>Mrs.</option><option>Dr.</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label for="rollNumber" class="form-label">Roll Number *</label>
            <input class="form-control" id="rollNumber" name="rollNumber" required>
          </div>
          <div class="col-12 col-md-6">
            <label for="firstName" class="form-label">First Name *</label>
            <input class="form-control" id="firstName" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="col-12 col-md-6">
            <label for="mobile" class="form-label">Mobile Number *</label>
            <input class="form-control" id="mobile" name="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required>
            <div class="form-text">Enter 10 digits without spaces.</div>
          </div>
          <div class="col-12">
            <label for="email" class="form-label">Email ID *</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="col-12">
            <label for="address" class="form-label">Address *</label>
            <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
          </div>
          <div class="col-12 d-flex flex-wrap gap-2">
            <button class="btn btn-primary px-4" type="submit">Register</button>
            <button class="btn btn-outline-secondary" type="reset">Clear Form</button>
          </div>
        </form>
        <div id="result" class="alert alert-success mt-4 d-none" role="status"></div>
      </div>
    </div>
    <p class="text-center text-secondary small mt-3">Fixora · Practical 5 demonstration</p>
  </main>

  <!-- CDN version of Bootstrap JavaScript (Part I). For offline mode, comment this out and uncomment the local script below. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script> -->
  <script>
    // Demonstration only: this form validates input but does not send it to a server/database.
    document.getElementById("registrationForm").addEventListener("submit", function (event) {
      event.preventDefault();
      if (!this.checkValidity()) {
        this.reportValidity();
        return;
      }
      const firstName = document.getElementById("firstName").value.trim();
      const rollNumber = document.getElementById("rollNumber").value.trim();
      const result = document.getElementById("result");
      result.textContent = "Registration form validated for " + firstName + " (Roll No. " + rollNumber + "). No data has been uploaded.";
      result.classList.remove("d-none");
    });
    document.getElementById("registrationForm").addEventListener("reset", function () {
      document.getElementById("result").classList.add("d-none");
    });
  </script>
</body>
</html>
